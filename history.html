<!-- history.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Translation History</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
    }
    h1 {
      font-size: 20px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      padding: 10px;
      margin-bottom: 6px;
      background: #f0f0f0;
      border-radius: 6px;
    }
    #clearHistory {
      margin-top: 12px;
      padding: 8px 12px;
      background: #d93025;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Translation History</h1>
  <ul id="historyList"></ul>
  <button id="clearHistory">Clear History</button>

  <script src="history.js"></script>
</body>
</html>
